name: Suggestion
description: An idea to improve Farm Helper.
title: "[Suggestion]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. You can write in English or Portuguese.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the mod is this about?
      options:
        - Job Market
        - Create Task
        - Working hours
        - Phone and messages
        - Team events
        - Performance and inspection
        - Skills and training
        - Payroll
        - Monthly report
        - Something new
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
      description: Tell us about the situation in your game.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
    validations:
      required: true
